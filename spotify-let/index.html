<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <title>Spotify Applet</title>
    <style>
      :root {
        --primary-color: #1DB954;
        --background-color: #121212;
        --text-color: #FFFFFF;
        --secondary-color: #282828;
        --tertiary-color: #404040;
      }

      html, body {
        padding: 0;
        margin: 0;
        background-color: var(--background-color);
        color: var(--text-color);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .section {
        background-color: var(--secondary-color);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
      }

      .profile-section {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
      }

      .profile-info {
        flex: 1;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }

      .now-playing {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px;
        background: linear-gradient(to right, var(--secondary-color), var(--tertiary-color));
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .now-playing-info {
        flex: 1;
      }

      .album-art {
        width: 150px;
        height: 150px;
        border-radius: 8px;
        object-fit: cover;
      }

      .progress-container {
        width: 100%;
        height: 4px;
        background-color: var(--tertiary-color);
        border-radius: 2px;
        margin: 10px 0;
        cursor: pointer;
      }

      .progress-bar {
        height: 100%;
        background-color: var(--primary-color);
        border-radius: 2px;
        width: 0%;
      }

      .time-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.8em;
        color: #b3b3b3;
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .search-section {
        margin-bottom: 30px;
      }

      .search-input {
        width: 100%;
        padding: 12px;
        border-radius: 20px;
        border: none;
        background-color: var(--tertiary-color);
        color: var(--text-color);
        font-size: 16px;
        margin-bottom: 20px;
      }

      .content-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 20px;
        padding-right: 10px;
      }

      .content-grid::-webkit-scrollbar {
        width: 8px;
      }

      .content-grid::-webkit-scrollbar-track {
        background: var(--secondary-color);
        border-radius: 4px;
      }

      .content-grid::-webkit-scrollbar-thumb {
        background: var(--tertiary-color);
        border-radius: 4px;
      }

      .content-grid::-webkit-scrollbar-thumb:hover {
        background: var(--primary-color);
      }

      .content-card {
        background-color: var(--secondary-color);
        border-radius: 8px;
        padding: 15px;
        transition: transform 0.2s, background-color 0.2s;
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }

      .content-card:hover {
        transform: translateY(-5px);
        background-color: var(--tertiary-color);
      }

      .content-card img {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 4px;
        object-fit: cover;
        margin-bottom: 10px;
      }

      .content-card h3 {
        margin: 0;
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .content-card p {
        margin: 5px 0;
        font-size: 14px;
        color: #b3b3b3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .content-title {
        font-size: 24px;
        font-weight: bold;
      }

      .content-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .content-tab {
        padding: 8px 16px;
        border-radius: 20px;
        background-color: var(--tertiary-color);
        cursor: pointer;
        transition: background-color 0.2s;
        user-select: none;
      }

      .content-tab.active {
        background-color: var(--primary-color);
      }

      .content-tab:hover {
        background-color: var(--primary-color);
        opacity: 0.8;
      }

      .loading-spinner {
        display: none;
        width: 40px;
        height: 40px;
        margin: 20px auto;
        border: 4px solid var(--tertiary-color);
        border-top: 4px solid var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #b3b3b3;
      }

      .playback-controls {
        display: flex;
        gap: 15px;
        align-items: center;
        justify-content: center;
        margin: 20px 0;
      }

      .playback-controls button {
        background: none;
        border: none;
        color: var(--text-color);
        font-size: 24px;
        cursor: pointer;
        padding: 10px;
        border-radius: 50%;
        transition: background-color 0.2s;
      }

      .playback-controls button:hover {
        background-color: var(--tertiary-color);
      }

      .playback-controls .play-pause {
        font-size: 32px;
        background-color: var(--primary-color);
      }

      .playback-controls .play-pause:hover {
        background-color: #1ed760;
      }

      .playback-controls .shuffle,
      .playback-controls .repeat {
        font-size: 20px;
        opacity: 0.7;
        transition: all 0.2s ease;
      }

      .playback-controls .shuffle.active {
        opacity: 1;
        color: var(--primary-color);
        transform: scale(1.1);
      }

      .playback-controls .shuffle.active::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        background-color: var(--primary-color);
        border-radius: 50%;
      }

      .playback-controls .repeat[data-state="off"] {
        opacity: 0.7;
      }

      .playback-controls .repeat[data-state="context"] {
        opacity: 1;
        color: var(--primary-color);
      }

      .playback-controls .repeat[data-state="track"] {
        opacity: 1;
        color: var(--primary-color);
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }

      button {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #1ed760;
      }

      input[type="text"] {
        padding: 10px;
        border-radius: 20px;
        border: none;
        background-color: var(--tertiary-color);
        color: white;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        background: var(--tertiary-color);
        border-radius: 2px;
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        background: var(--primary-color);
        border-radius: 50%;
        cursor: pointer;
      }

      input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        background: var(--primary-color);
        border-radius: 50%;
        cursor: pointer;
        border: none;
      }

      input[type="range"]::-ms-thumb {
        width: 12px;
        height: 12px;
        background: var(--primary-color);
        border-radius: 50%;
        cursor: pointer;
      }

      .search-results {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .track-card {
        background-color: var(--tertiary-color);
        border-radius: 8px;
        padding: 15px;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .track-card:hover {
        transform: translateY(-5px);
      }

      .track-card img {
        width: 100%;
        border-radius: 4px;
        margin-bottom: 10px;
      }

      .track-card h3 {
        margin: 0;
        font-size: 1em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .track-card p {
        margin: 5px 0;
        font-size: 0.9em;
        color: #b3b3b3;
      }

      .output {
        background-color: #000;
        padding: 15px;
        border-radius: 8px;
        min-height: 100px;
        white-space: pre-wrap;
        font-family: monospace;
        overflow-x: auto;
      }

      h1, h2, h3 {
        color: var(--text-color);
        margin-top: 0;
      }

      a {
        color: var(--primary-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .hidden {
        display: none;
      }

      .volume-section {
        transition: opacity 0.3s ease;
      }

      .volume-section.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .playlist-info {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--tertiary-color);
      }

      .playlist-info h4 {
        margin: 0 0 10px 0;
        color: var(--text-color);
        font-size: 1em;
      }

      .playlist-info p {
        margin: 0;
        color: #b3b3b3;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="profile-section">
        <img id="avatar" class="avatar" src="" alt="Profile" />
        <div class="profile-info">
          <h2 id="displayName">Loading...</h2>
          <p id="email"></p>
        </div>
      </div>

      <div class="now-playing section">
        <img id="nowPlayingArt" class="album-art" src="#" alt="Album Art" />
        <div class="now-playing-info">
          <h3 id="nowPlayingTitle">No track playing</h3>
          <p id="nowPlayingArtist"></p>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="time-info">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
          <div class="playback-controls">
            <button id="previousBtn" class="previous">⏮️</button>
            <button id="shuffleBtn" class="shuffle" title="Toggle shuffle" data-state="off">🔀</button>
            <button id="playPauseBtn" class="play-pause">▶️</button>
            <button id="repeatBtn" class="repeat" title="Toggle repeat" data-state="off">🔁</button>
            <button id="nextBtn" class="next">⏭️</button>
          </div>
          <div class="playlist-info" id="playlistInfo">
            <h4>Playing from: <span id="playlistName">-</span></h4>
            <p>Next up: <span id="nextTrack">-</span></p>
          </div>
        </div>
      </div>

      <div class="section search-section">
        <input type="text" id="searchInput" class="search-input" placeholder="Search for songs, artists, or albums...">
        <div class="content-tabs">
          <div class="content-tab" id="searchTab">Search</div>
          <div class="content-tab" id="playlistTab">Your Playlists</div>
          <div class="content-tab" id="recentlyPlayedTab">Recently Played</div>
        </div>
        <div id="contentContainer" class="content-grid">
          <!-- Content will be dynamically populated here -->
        </div>
        <div id="loadingSpinner" class="loading-spinner"></div>
      </div>

      <div class="section">
        <h2>Volume Control</h2>
        <div class="controls">
          <div class="control-group">
            <input type="range" id="volumeInput" min="0" max="100" value="50" />
            <button id="volumeBtn">Set Volume</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
